aid: skan
name: Skan
description: >-
  Skan AI is an enterprise process-intelligence and agentic-AI platform that observes how work
  actually happens across desktop, web, mainframe, legacy, VDI, and office applications without
  integrations, then distills those observations into a "context graph of work" that powers AI
  agents to execute complex business processes. The platform layers Observation, Distillation,
  Context (Agent Operating Procedures), Agents, and Control, and ships as Process Intelligence,
  Engineering Intelligence, and an AI Agent Builder. Skan serves financial services, insurance,
  healthcare, high tech, and energy/utilities with in-environment processing so customer data
  never leaves the enterprise perimeter. Backed by Bloomberg Beta and surfaced into the API
  Evangelist network from that portfolio. Skan is an enterprise SaaS product; it exposes no
  public developer API, OpenAPI specification, or SDKs — its documentation portal is gated and
  its architecture is described as cloud-native and API-first for in-product integration only.
